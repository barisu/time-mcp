[project]
name = "time-mcp"
version = "0.1.0"
description = "Simple MCP server that returns the current datetime over HTTP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.2,<2",
]

[project.scripts]
time-mcp = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
